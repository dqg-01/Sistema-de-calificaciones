spring.application.name=sistema-de-calificaciones

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/uco_calificaciones
spring.datasource.username=uco_app
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
